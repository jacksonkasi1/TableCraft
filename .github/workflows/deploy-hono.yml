name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'apps/hono-example/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-hono.yml'

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    # Skip cleanly instead of failing every push when Fly.io is not configured.
    if: ${{ vars.ENABLE_FLY_DEPLOY == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config apps/hono-example/fly.toml --dockerfile apps/hono-example/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
