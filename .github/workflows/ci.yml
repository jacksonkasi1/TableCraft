name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Workspace packages publish types from dist. Build the foundational
      # packages first so a clean checkout can typecheck downstream packages.
      - name: Bootstrap workspace types
        run: |
          bun run --filter @tablecraft/engine build
          bun run --filter @tablecraft/client build
          bun run --filter @tablecraft/adapter-hono build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
